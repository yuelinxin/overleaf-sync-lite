[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overleaf-sync-lite"
version = "0.1.3"
description = "Conservative two-way Overleaf sync using the free web interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["playwright>=1.45,<2"]
license = {text = "MIT"}

[project.scripts]
ols = "olsync:main"
olsync = "olsync:main"

[tool.setuptools]
py-modules = ["olsync", "web_transport"]
